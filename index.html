<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ひとこと文殊</title>
<style>
:root{
  --bg:#f7f3ee; --card:#fff; --ink:#2b2024; --sub:#7a6a70; --line:#e6dcd6;
  --wine:#7b1e3a; --wine-soft:#f3e4e8; --wait:#b5651d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1618; --card:#271f22; --ink:#f1e9ec; --sub:#a8979d; --line:#3a2f33;
    --wine:#d9708f; --wine-soft:#3a2229; --wait:#e0a060; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:8px 0 4px;color:var(--wine);letter-spacing:.04em}
.lead{color:var(--sub);font-size:13px;margin:0 0 16px}
input,button{font:inherit}
input[type=text],input[type=password],textarea{width:100%;padding:12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--wine);color:#fff;
  font-weight:600;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--sub);padding:6px 8px;font-weight:400}
button:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.err{color:#c0392b;font-size:13px;min-height:1.4em;margin-top:8px}
.hidden{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.me{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.row input,.row textarea{flex:1;min-width:0}
textarea{resize:none;line-height:1.5;font-family:inherit}
.row{align-items:flex-end}
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 20px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.qtext{font-size:17px;font-weight:600;line-height:1.5;word-break:break-word}
.meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;color:var(--wait);border:1px solid var(--wait);border-radius:999px;padding:0 6px}
.answers{margin:10px 0 0;padding:0;list-style:none}
.answers li{background:var(--wine-soft);border-radius:10px;padding:8px 10px;margin-top:6px}
.atext{line-height:1.5;word-break:break-word}
.qtext a,.atext a{color:var(--wine);word-break:break-all}
.reply{margin-top:10px}
.reply textarea{padding:9px 10px;font-size:16px}
.reply button{padding:9px 12px}
.del{background:none;color:var(--sub);padding:0 4px;font-weight:400;font-size:12px;text-decoration:underline}
.empty{color:var(--sub);text-align:center;padding:32px 0;font-size:14px}
.leave{font-size:13px;flex:none}
.rename{background:none;color:var(--ink);padding:4px 2px;font-weight:400;font-size:13px}
.cam{background:transparent;color:var(--ink);border:1px solid var(--line);padding:11px 10px;font-weight:400}
.reply .cam{padding:8px 9px}
.pick{display:flex;align-items:center;gap:6px;margin-top:6px}
.pick img{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pick button{background:none;color:var(--sub);padding:4px 8px;font-weight:400}
.photo{display:block;width:100%;border-radius:10px;margin-top:8px}
.see{background:none;color:var(--wine);padding:4px 0 0;font-weight:400;font-size:13px}
.like{background:none;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-weight:400;font-size:12px}
.like.on{color:#fff;background:var(--wine);border-color:var(--wine)}
.find{position:relative;margin:0 0 12px}
.find span{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:14px}
.find input{padding-left:36px}
.admin{font-size:11px;color:#fff;background:var(--wine);border-radius:999px;padding:1px 6px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 入口 -->
  <section id="gate" class="hidden">
    <h1>ひとこと文殊</h1>
    <p class="lead">会員だけの掲示板です。<br>一言で聞いて、一言で答えます。</p>
    <form id="gateForm">
      <label for="pass">パスワード</label>
      <input id="pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label for="name">ニックネーム（12字まで）</label>
      <input id="name" type="text" maxlength="12" required>
      <div style="margin-top:16px"><button type="submit" id="gateBtn">入る</button></div>
      <div class="err" id="gateErr"></div>
    </form>
  </section>

  <!-- 本体 -->
  <section id="main" class="hidden">
    <div class="bar">
      <h1>ひとこと文殊</h1>
      <button class="ghost leave" id="leaveBtn">退出</button>
    </div>
    <div class="me" id="meLine"></div>

    <form class="ask" id="askForm">
      <div class="row">
        <textarea id="askInput" rows="2" maxlength="140" placeholder="一言で質問（140字まで）"></textarea>
        <button type="button" class="cam" id="askCam" aria-label="写真を付ける">📷</button>
        <button type="submit">聞く</button>
      </div>
      <div id="askPick"></div>
    </form>
    <div class="err" id="mainErr"></div>
    <div class="find"><span aria-hidden="true">🔍</span><input id="findInput" type="text" enterkeyhint="search" placeholder="キーワードで探す" aria-label="キーワードで探す"></div>

    <div id="list"></div>
  </section>

</div>

<script>
"use strict";
const MAX_Q = 140, MAX_A = 140, MAX_NAME = 12;
const LS = "wcf-hitokoto:";
const params = new URLSearchParams(location.search);
const MOCK = params.has("mock");

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDW89EnVh-bZjfIpnTidcGOX1NqnhQ9tp8",
  authDomain: "wine-aroma-board.firebaseapp.com",
  databaseURL: "https://wine-aroma-board-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wine-aroma-board",
};
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.14.1/";

// ---------- 小道具 ----------
const $ = id => document.getElementById(id);
const ls = {
  get(k){ try{ return localStorage.getItem(LS+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(LS+k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(LS+k); }catch(e){} },
};
const clean = (s, max) => (s||"").normalize("NFKC").replace(/\s+/g," ").replace(/[\u0000-\u001f\u007f]/g,"").trim().slice(0,max);
async function roomOf(pass){
  const data = new TextEncoder().encode("wcf-hitokoto|" + pass.normalize("NFKC").trim());
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function ago(t){
  const s = Math.max(0, (Date.now()-t)/1000);
  if (s < 60) return "いま";
  if (s < 3600) return Math.floor(s/60)+"分前";
  if (s < 86400) return Math.floor(s/3600)+"時間前";
  if (s < 86400*30) return Math.floor(s/86400)+"日前";
  const d = new Date(t); return (d.getMonth()+1)+"/"+d.getDate();
}
// 本文中の http(s) のURLだけを、新しいタブで開くリンクにする（ほかは文字のまま）
function linkify(text){
  const out = [], re = /https?:\/\/[^\s<>"'「」（）()、。]+/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    let url = m[0].replace(/[.,!?！？]+$/, "");
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(el("a",{href:url, target:"_blank", rel:"noopener noreferrer nofollow"}, url));
    last = m.index + url.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}
function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ng(new Error("load "+src)); document.head.append(s); }); }

// 写真：長い辺640pxの JPEG に描き直す（EXIF は消える）。base64 で約100KBを超えたら品質を下げ、それでも重ければ縮める
const PHOTO_MAX = 100000;
async function shrinkPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok,ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    let scale = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight)), q = 0.7, d = "";
    for (let k = 0; k < 20; k++){
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth*scale)); c.height = Math.max(1, Math.round(img.naturalHeight*scale));
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      d = c.toDataURL("image/jpeg", q);
      if (d.length <= PHOTO_MAX) break;
      if (q > 0.35) q -= 0.1; else scale *= 0.8;
    }
    if (!d.startsWith("data:image/jpeg;base64,")) throw new Error("jpeg");
    return d;
  } finally { URL.revokeObjectURL(url); }
}
// 📷で選んだ写真（送るまで覚えておく。キーは "_ask" か質問id）
const picked = {};
const shownPhoto = {};   // 「写真を見る」で読み込んだもの（描き直しで消えないように）
function choosePhoto(key){
  const f = el("input",{type:"file", accept:"image/*", class:"hidden"});
  f.addEventListener("change", async () => {
    const file = f.files && f.files[0]; f.remove(); if (!file) return;
    try { picked[key] = await shrinkPhoto(file); setErr("mainErr"); }
    catch(e){ setErr("mainErr","写真を読めませんでした"); }
    key === "_ask" ? renderAskPick() : render();
  });
  document.body.append(f); f.click();
}
function pickView(key){
  if (!picked[key]) return null;
  return el("div",{class:"pick"}, el("img",{src:picked[key], alt:""}),
    el("button",{type:"button", "aria-label":"写真を取り消す", onclick:()=>{ delete picked[key]; key==="_ask" ? renderAskPick() : render(); }},"×"));
}
function renderAskPick(){ const b = $("askPick"); b.innerHTML = ""; const v = pickView("_ask"); if (v) b.append(v); }
function photoView(key, load){
  if (shownPhoto[key]) return el("img",{class:"photo", src:shownPhoto[key], alt:"添付の写真"});
  const btn = el("button",{type:"button", class:"see", onclick: async () => {
    btn.disabled = true;
    try { const d = await load(); if (!d) throw new Error("PERMISSION"); shownPhoto[key] = d; btn.replaceWith(photoView(key, load)); }
    catch(e){ btn.disabled = false; setErr("mainErr", "写真を読み込めませんでした"); }
  }},"📷写真を見る");
  return btn;
}

// ---------- 保存先（Firebase / 試し版） ----------
class FireStore {
  async init(){
    for (const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-database-compat.js"]) await loadScript(FIREBASE_SDK+f);
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    const auth = app.auth();
    let user = auth.currentUser || await new Promise(r=>{ const u=auth.onAuthStateChanged(x=>{u(); r(x);}); });
    if (!user) user = (await auth.signInAnonymously()).user;
    this.uid = user.uid; this.db = app.database();
  }
  async open(room){
    this.room = this.db.ref("wcf/"+room);
    const timeout = new Promise((_,ng) => setTimeout(() => ng(new Error("network timeout")), 10000));
    try { await Promise.race([this.room.child("q").limitToLast(1).once("value"), timeout]);
          this.db.ref("wcfKey").set(room).catch(()=>{});   // 管理者が部屋を見つけるための鍵（ルールで正しい値しか書けない）
          return true; }
    catch(e){ if (/network/.test(e.message)) throw e; return false; }   // 合言葉違い＝ルールで読めない
  }
  subscribe(cb){
    let q = {}, a = {}, l = {};
    const fire = () => cb(q, a, null, l);
    this.room.child("q").limitToLast(300).on("value", s => { q = s.val()||{}; fire(); }, err => cb(null,null,err));
    this.room.child("a").on("value", s => { a = s.val()||{}; fire(); }, err => cb(null,null,err));
    this.room.child("lk").on("value", s => { l = s.val()||{}; fire(); }, err => cb(null,null,err));   // いいね（小さいデータ）
  }
  // 投稿と写真は多重パスの update でまとめて書く（写真の中身は qi / ai、本文には印 p だけ）
  ask(n, x, photo){
    const id = this.room.child("q").push().key, post = { u:this.uid, n, x, t:firebase.database.ServerValue.TIMESTAMP };
    if (!photo) return this.room.child("q/"+id).set(post);
    return this.room.update({ ["q/"+id]:{...post, p:true}, ["qi/"+id]:{ u:this.uid, d:photo } });
  }
  answer(qid, n, x, photo){
    const id = this.room.child("a/"+qid).push().key, post = { u:this.uid, n, x, t:firebase.database.ServerValue.TIMESTAMP };
    if (!photo) return this.room.child("a/"+qid+"/"+id).set(post);
    return this.room.update({ ["a/"+qid+"/"+id]:{...post, p:true}, ["ai/"+qid+"/"+id]:{ u:this.uid, d:photo } });
  }
  delQ(qid){ return this.room.update({ ["q/"+qid]:null, ["a/"+qid]:null, ["qi/"+qid]:null, ["ai/"+qid]:null, ["lk/"+qid]:null }); }
  delA(qid, aid){ return this.room.update({ ["a/"+qid+"/"+aid]:null, ["ai/"+qid+"/"+aid]:null, ["lk/"+qid+"/"+aid]:null }); }
  like(qid, k, on){ const r = this.room.child("lk/"+qid+"/"+k+"/"+this.uid); return on ? r.set(true) : r.remove(); }
  async photo(qid, aid){ const s = await this.room.child(aid ? "ai/"+qid+"/"+aid : "qi/"+qid).once("value"); return s.val() && s.val().d; }
  async becomeAdmin(code){ await this.db.ref("wcfAdmins/"+this.uid).set(code); }
  // 管理用の合言葉はFirebaseのルールで照合する（ページには手がかりを置かない）
  async adminRoom(code){
    try { await this.becomeAdmin(code); } catch(e){ if (/network/i.test(String(e.code||e.message))) throw e; return null; }
    const v = (await this.db.ref("wcfKey").once("value")).val();
    return v || "";
  }
  async dropAdmin(){ try{ await this.db.ref("wcfAdmins/"+this.uid).remove(); }catch(e){} }
}

// 試し版：この端末のブラウザだけに保存。パスワードは「test」、管理用は「admin」
class MockStore {
  async init(){ this.uid = ls.get("mockUid") || ("me-"+Math.random().toString(36).slice(2,8)); ls.set("mockUid", this.uid); }
  _load(){ try{ return JSON.parse(localStorage.getItem(LS+"mockData")) || {q:{},a:{}}; }catch(e){ return {q:{},a:{}}; } }
  _save(d){ localStorage.setItem(LS+"mockData", JSON.stringify(d)); this.cb && this.cb(d.q, d.a, null, d.lk||{}); }
  async open(room){ return room === await roomOf("test"); }
  subscribe(cb){ this.cb = cb; const d=this._load(); cb(d.q, d.a, null, d.lk||{});
    window.addEventListener("storage", e => { if (e.key===LS+"mockData"){ const d=this._load(); cb(d.q,d.a,null,d.lk||{}); } }); }
  async like(qid,k,on){ const d=this._load(); const lk=(d.lk ||= {});
    if (on){ if(!d.q[qid] || (k!=="q" && !d.a[qid]?.[k])) throw new Error("PERMISSION_DENIED"); ((lk[qid] ||= {})[k] ||= {})[this.uid]=true; }
    else if (lk[qid]?.[k]) delete lk[qid][k][this.uid];
    this._save(d); }
  _id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  // 写真は本文と別のキーに置く（本番の qi / ai と同じ分け方）
  _img(){ try{ return JSON.parse(localStorage.getItem(LS+"mockImg")) || {}; }catch(e){ return {}; } }
  _setImg(o){ localStorage.setItem(LS+"mockImg", JSON.stringify(o)); }
  async ask(n,x,photo){ const d=this._load(), id=this._id(); d.q[id]={u:this.uid,n,x,t:Date.now()};
    if (photo){ d.q[id].p=true; const im=this._img(); im["qi/"+id]={u:this.uid,d:photo}; this._setImg(im); } this._save(d); }
  async answer(qid,n,x,photo){ const d=this._load(), id=this._id(); if(!d.q[qid]) throw new Error("PERMISSION_DENIED"); (d.a[qid] ||= {})[id]={u:this.uid,n,x,t:Date.now()};
    if (photo){ d.a[qid][id].p=true; const im=this._img(); im["ai/"+qid+"/"+id]={u:this.uid,d:photo}; this._setImg(im); } this._save(d); }
  async photo(qid,aid){ const v=this._img()[aid ? "ai/"+qid+"/"+aid : "qi/"+qid]; return v && v.d; }
  _dropImg(pre){ const im=this._img(); for (const k of Object.keys(im)) if (k===pre || k.startsWith(pre+"/")) delete im[k]; this._setImg(im); }
  _canDel(owner){ return owner===this.uid || ls.get("mockAdmin")==="1"; }
  async delQ(qid){ const d=this._load(); if(!this._canDel(d.q[qid]?.u)) throw new Error("PERMISSION_DENIED"); delete d.q[qid]; delete d.a[qid]; if (d.lk) delete d.lk[qid]; this._dropImg("qi/"+qid); this._dropImg("ai/"+qid); this._save(d); }
  async delA(qid,aid){ const d=this._load(); if(!this._canDel(d.a[qid]?.[aid]?.u)) throw new Error("PERMISSION_DENIED"); delete d.a[qid][aid]; if (d.lk?.[qid]) delete d.lk[qid][aid]; this._dropImg("ai/"+qid+"/"+aid); this._save(d); }
  async becomeAdmin(code){ if(code!=="admin") throw new Error("PERMISSION_DENIED"); ls.set("mockAdmin","1"); }
  async adminRoom(code){ if (code!=="admin") return null; ls.set("mockAdmin","1"); return roomOf("test"); }
  async dropAdmin(){ ls.del("mockAdmin"); }
}

// ---------- 画面 ----------
const store = MOCK ? new MockStore() : new FireStore();
let me = { name: "", admin: false };
let data = { q:{}, a:{}, l:{} };

function show(id){ for (const s of ["gate","main"]) $(s).classList.toggle("hidden", s!==id); }
function setErr(id, msg){ $(id).textContent = msg || ""; }
function friendly(e){
  const m = String(e && (e.code || e.message) || e);
  if (/PERMISSION|permission/.test(m)) return "書き込めませんでした。もう消された投稿かもしれません";
  if (/network|offline/i.test(m)) return "つながりません。電波のよい所でもう一度";
  return "うまくいきませんでした。もう一度どうぞ";
}
function renderMe(){
  $("meLine").innerHTML = "";
  $("meLine").append("あなた：", el("button",{class:"rename", onclick:rename}, me.name+" ✎"), me.admin ? el("span",{class:"admin"},"管理者") : "");
}

const drafts = {};
function render(){
  const list = $("list");
  // 入力途中の回答欄を残す（検索で隠れている質問の下書きも覚えたまま）
  list.querySelectorAll("textarea[data-q]").forEach(i => { if (i.value) drafts[i.dataset.q] = i.value; else delete drafts[i.dataset.q]; });
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.q : null;
  list.innerHTML = "";
  const qs = Object.entries(data.q).map(([id,q]) => {
    const ans = Object.entries(data.a[id]||{}).sort((x,y)=>x[1].t-y[1].t);
    return { id, ...q, ans };
  });
  // 回答まちを上に。その中は新しい順
  qs.sort((x,y) => {
    const wx = x.ans.length===0, wy = y.ans.length===0;
    if (wx !== wy) return wx ? -1 : 1;
    return y.t - x.t;
  });
  if (!qs.length){ list.append(el("div",{class:"empty"},"まだ質問がありません。最初の一言をどうぞ。")); return; }
  const kw = fold($("findInput").value).trim();
  for (const q of qs){
    if (kw && ![q.x, q.n, ...q.ans.flatMap(([,a]) => [a.x, a.n])].some(s => fold(s).includes(kw))) continue;
    const wait = q.ans.length === 0;
    const card = el("article",{class:"q"},
      el("div",{class:"qtext"}, ...linkify(q.x)),
      q.p ? photoView("q/"+q.id, () => store.photo(q.id)) : null,
      el("div",{class:"meta"}, q.n+" ・ "+ago(q.t), likeBtn(q.id, "q"), wait ? el("span",{class:"tag"},"回答まち") : null,
        (q.u===store.uid || me.admin) ? el("button",{class:"del", onclick:()=>delQ(q.id)},"消す") : null)
    );
    if (q.ans.length){
      const ul = el("ul",{class:"answers"});
      for (const [aid,a] of q.ans){
        ul.append(el("li",{},
          el("div",{class:"atext"}, ...linkify(a.x)),
          a.p ? photoView("a/"+q.id+"/"+aid, () => store.photo(q.id, aid)) : null,
          el("div",{class:"meta"}, a.n+" ・ "+ago(a.t), likeBtn(q.id, aid),
            (a.u===store.uid || me.admin) ? el("button",{class:"del", onclick:()=>delA(q.id,aid)},"消す") : null)
        ));
      }
      card.append(ul);
    }
    const inp = el("textarea",{rows:"2", maxlength:String(MAX_A), placeholder:"一言で答える", "aria-label":"回答", "data-q":q.id});
    if (drafts[q.id]) inp.value = drafts[q.id];
    const form = el("form",{class:"row reply", onsubmit: async ev => {
      ev.preventDefault();
      const x = clean(inp.value, MAX_A); if (!x) return;
      inp.disabled = true;
      try { await store.answer(q.id, me.name, x, picked[q.id]); inp.value=""; delete picked[q.id]; setErr("mainErr");
        // 送信中に描き直されていたら、新しい回答欄にも下書きが写っているので空にする
        list.querySelectorAll("textarea[data-q]").forEach(t => { if (t.dataset.q === q.id) t.value = ""; }); render(); }
      catch(e){ setErr("mainErr", friendly(e)); }
      inp.disabled = false;
    }}, inp, el("button",{type:"button", class:"cam", "aria-label":"写真を付ける", onclick:()=>choosePhoto(q.id)},"📷"), el("button",{type:"submit"},"答える"));
    card.append(form);
    const pv = pickView(q.id); if (pv) card.append(pv);
    list.append(card);
    if (focused === q.id) inp.focus();
  }
}

// いいね：「👍 3」。自分が押したものは色を変える。もう一度押すと取り消し
function likeBtn(qid, k){
  const who = (data.l[qid] && data.l[qid][k]) || {}, n = Object.keys(who).length, mine = !!who[store.uid];
  return el("button",{type:"button", class:"like"+(mine?" on":""), "aria-pressed":String(mine), onclick: async () => {
    try { await store.like(qid, k, !mine); } catch(e){ setErr("mainErr", friendly(e)); }
  }}, "👍 "+n);
}
// 検索：大文字小文字・全角半角を区別しない（読み込み済みの分だけ。通信しない）
const fold = s => (s||"").normalize("NFKC").toLowerCase();
$("findInput").addEventListener("input", () => render());

async function delQ(qid){
  if (!confirm("この質問を回答ごと消しますか？")) return;
  try { await store.delQ(qid); } catch(e){ setErr("mainErr", friendly(e)); }
}
async function delA(qid, aid){
  if (!confirm("この回答を消しますか？")) return;
  try { await store.delA(qid, aid); } catch(e){ setErr("mainErr", friendly(e)); }
}

async function enter(room){
  const ok = await store.open(room);
  if (!ok) return false;
  show("main"); renderMe();
  store.subscribe((q,a,err,l) => {
    if (err){ setErr("mainErr","パスワードが変わったようです。右上の「退出」から入り直してください"); return; }
    data = { q, a, l: l||{} }; render();
  });
  setInterval(render, 60000); // 「◯分前」を更新
  return true;
}

$("gateForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = clean($("name").value, MAX_NAME);
  const pass = $("pass").value;
  if (!name){ setErr("gateErr","ニックネームを入れてください"); return; }
  $("gateBtn").disabled = true; setErr("gateErr");
  try {
    me.name = name;
    const room = await roomOf(pass);
    if (await enter(room)){ ls.set("room", room); ls.set("name", name); }
    else {
      // 会員の合言葉で開かなければ、管理用の合言葉として試す
      const code = pass.normalize("NFKC").trim();
      const aroom = await store.adminRoom(code);
      if (aroom === null){ setErr("gateErr","パスワードが違います"); }
      else if (aroom === ""){ setErr("gateErr","先に会員のパスワードで一度入ってから、もう一度どうぞ"); }
      else {
        me.admin = true;
        if (await enter(aroom)){ ls.set("room", aroom); ls.set("name", name); ls.set("admin","1"); }
        else { me.admin = false; setErr("gateErr","パスワードが違います"); }
      }
    }
  } catch(e){ setErr("gateErr", friendly(e)); }
  $("gateBtn").disabled = false;
});

$("askCam").addEventListener("click", () => choosePhoto("_ask"));
$("askForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const x = clean($("askInput").value, MAX_Q); if (!x) return;
  $("askInput").disabled = true;
  try { await store.ask(me.name, x, picked._ask); $("askInput").value=""; delete picked._ask; renderAskPick(); setErr("mainErr"); }
  catch(e){ setErr("mainErr", friendly(e)); }
  $("askInput").disabled = false;
});

function rename(){
  const n = clean(prompt("新しいニックネーム（12字まで）", me.name), MAX_NAME);
  if (n){ me.name = n; ls.set("name", n); renderMe(); }
}
$("leaveBtn").addEventListener("click", async () => {
  if (!confirm("退出しますか？投稿は残ります")) return;
  if (me.admin) await store.dropAdmin();
  for (const k of ["room","name","admin"]) ls.del(k);
  location.reload();
});

(async () => {
  try { await store.init(); }
  catch(e){ show("gate"); setErr("gateErr","つながりません。電波のよい所で開き直してください"); return; }
  const room = ls.get("room"), name = ls.get("name");
  me.admin = ls.get("admin") === "1";
  if (room && name){
    me.name = name;
    try { if (await enter(room)) return; }
    catch(e){ show("gate"); $("name").value = name; setErr("gateErr","つながりません。電波のよい所で開き直してください"); return; }
  }
  for (const k of ["room","admin"]) ls.del(k);
  me.admin = false;
  if (name) $("name").value = name;
  show("gate");
})();
</script>
